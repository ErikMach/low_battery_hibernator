[package]
name = "low_battery_hibernator"
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = "z"
panic = "abort"
strip = "debuginfo"
lto = "fat"
codegen-units = 1

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_SystemServices", "Win32_UI", "Win32_UI_WindowsAndMessaging"] }
